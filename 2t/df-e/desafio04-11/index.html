<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Luiz Henrique Dainez Alecrim <br>e<br> Juan Alexandre Jaques Carrasco</h1>
    </header>
    <form action="">
        <label for="lbrazsocial">Razão Social: </label>
        <input id="inrazsocial" type="text">
        <br>
        <label for="lbnomefanta">Nome Fantasia: </label>
        <input id="innomefanta" type="text">
        <br>
        <label for="lbemail">Email: </label>
        <input id="inemail" type="email">
        <br>
        <label for="lbcnpj">CNPJ: </label>
        <input id="incnpj" type="text">
        <br>
        <label for="lbtel">Telefone: </label>
        <input id="intel" type="tel">
        <br>
        <label for="lbdatinauguracao">Data Inauguração: </label>
        <input id="indatinauguracao" type="date">
        <br>
        <label for="lbsenha">Senha: </label>
        <input id="insenha" type="password">
        <br>
        <label for="lbconfsenha">Confirme a Senha: </label>
        <input id="inconfsenha" type="password">
        <br>
        <input id="btenviar" type="button" value="Enviar" onclick="enviar()">
    </form>
</body>
<script src="script.js"></script>
</html>
