<!doctype html>
<html lang="pt-br">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

  <title>Aula DOM - 01</title>
  <style type="text/css">
    * {
      font-family: calibri;
      font-size: 1.3rem;
    }
  </style>
  <script type="text/javascript" src="funcoes.js">
  </script>

</head>

<body>
  <h1 onclick="changetext(this)" 
     onmouseover="mOver(this)" onmouseout="mOut(this)">
         Primeira Aula com DOM - JS</h1>
  <hr>
  <img id="image" src="logoUnoeste.png" width="160" height="120">
  <hr>
  <form id="formulario">
    <input type="text" id="nome" placeholder="informe um texto/valor" size="60">
    <input type="button" id="btn2" value="Pegar valor" onclick="pegaValor()">
  </form>
  <p id="intro"> teste </p>
  <input type="button" id="btn3" value="Teste innerHTML" onclick="teste()">
  <hr>
  <div id="main">
    <p> paragrafo 1 </p>
    <p onmouseover="changetext(this)"> paragrafo 2 </p>
    <p> paragrafo 3 </p>
    <p onclick="changetext(this)"> paragrafo 4 </p>
  </div>
  <input type="button" value="Sugere Nomes" onclick="sugereNome()" />
